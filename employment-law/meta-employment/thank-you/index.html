window.RLG_EC=(function(){
  var KEY='rlg_ec';
  function s(v){return (v==null?'':String(v)).trim();}
  // Normalise a phone number to E.164 (assumes US when no country code is given).
  function phone(v){
    var t=s(v);if(!t)return '';
    if(t.charAt(0)==='+'){var kept='+'+t.slice(1).replace(/\D/g,'');return kept.length>1?kept:'';}
    var d=t.replace(/\D/g,'');if(!d)return '';
    if(d.length===10)return '+1'+d;
    if(d.length===11&&d.charAt(0)==='1')return '+'+d;
    return '+'+d;
  }
  // Build the Google Ads user_data payload from raw contact fields.
  function build(f){
    f=f||{};var data={};
    var email=s(f.email).toLowerCase();if(email)data.email=email;
    var ph=phone(f.phone!=null?f.phone:f.phone_number);if(ph)data.phone_number=ph;
    var first=s(f.first_name),last=s(f.last_name),
        postal=s(f.postal_code!=null?f.postal_code:f.zip),country=s(f.country);
    // Address is only sent when the full identifying set is present.
    if(first&&last&&postal&&country){
      var addr={first_name:first,last_name:last,postal_code:postal,country:country};
      var street=s(f.street),city=s(f.city),region=s(f.region!=null?f.region:f.state);
      if(street)addr.street=street;if(city)addr.city=city;if(region)addr.region=region;
      data.address=addr;
    }
    return data;
  }
  function save(f){try{var d=build(f);if(d.email||d.phone_number)sessionStorage.setItem(KEY,JSON.stringify(d));return d;}catch(e){return null;}}
